<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonkipar Demo Wallet</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-color);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Prank Tag */
        .prank-tag {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-title {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        .balance-section {
            text-align: center;
            margin: 30px 0;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            margin: 5px 0;
        }

        .address-tag {
            font-size: 12px;
            color: var(--text-sub);
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
        }

        .action-icon {
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: var(--accent-color);
            transition: 0.2s;
        }

        .action-icon:active {
            transform: scale(0.95);
        }

        .action-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .asset-list {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
        }

        .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .asset-item:last-child {
            border-bottom: none;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-symbol {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
        }

        .modal-content h3 {
            margin-top: 0;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid var(--text-sub);
            background: var(--bg-color);
            color: white;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-sub);
            float: right;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="prank-tag">PRANK / DEMO VERSION</div>
        
        <div class="header">
            <div class="wallet-title">Tonkipar Demo Wallet</div>
            <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
        </div>

        <div class="balance-section">
            <div class="balance-amount" id="mainBalance">$100.00</div>
            <div class="address-tag">Address: UQBv...rAfv (W5)</div>
        </div>

        <div class="action-grid">
            <button class="action-item" onclick="openModal('sendModal')">
                <div class="action-icon">↑</div>
                <div class="action-label">Send</div>
            </button>
            <button class="action-item" onclick="openModal('addModal')">
                <div class="action-icon">+</div>
                <div class="action-label">Add Funds</div>
            </button>
            <button class="action-item" onclick="alert('Swap feature is in Demo mode.')">
                <div class="action-icon">⇄</div>
                <div class="action-label">Swap</div>
            </button>
            <button class="action-item" onclick="alert('Stake feature is in Demo mode.')">
                <div class="action-icon">🔒</div>
                <div class="action-label">Stake</div>
            </button>
        </div>

        <div class="asset-list">
            <div class="asset-item">
                <div class="asset-info">
                    <div class="asset-symbol">T</div>
                    <div>
                        <div>TON</div>
                        <div style="font-size: 12px; color: var(--text-sub);">$2.50</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div id="tonBalance">0 TON</div>
                    <div style="font-size: 12px; color: var(--text-sub);">$0.00</div>
                </div>
            </div>
            <div class="asset-item">
                <div class="asset-info">
                    <div class="asset-symbol" style="background: #26a17b; color: white;">₮</div>
                    <div>
                        <div>USDT</div>
                        <div style="font-size: 12px; color: var(--text-sub);">$1.00</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div id="usdtBalance">100 USDT</div>
                    <div style="font-size: 12px; color: var(--text-sub);" id="usdtVal">$100.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Send Modal -->
    <div id="sendModal" class="modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal('sendModal')">✕</button>
            <h3>Send Crypto</h3>
            <input type="text" placeholder="Recipient Address">
            <input type="number" id="sendAmount" placeholder="Amount ($)">
            <button class="btn-submit" onclick="executeSend()">Send Now</button>
        </div>
    </div>

    <!-- Add Funds Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal('addModal')">✕</button>
            <h3>Add Demo Funds</h3>
            <input type="number" id="addAmountInput" placeholder="Enter Dollar Amount">
            <button class="btn-submit" onclick="addBalance()">Add to Balance</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal('settingsModal')">✕</button>
            <h3>Wallet Settings</h3>
            <p style="font-size: 14px; color: var(--text-sub);">Version: 1.0.0 (Prank Edition)</p>
            <button class="btn-submit" onclick="closeModal('settingsModal')">Save Settings</button>
        </div>
    </div>

    <script>
        let currentBalance = 100;

        function updateDisplay() {
            document.getElementById('mainBalance').innerText = '$' + currentBalance.toFixed(2);
            document.getElementById('usdtBalance').innerText = currentBalance + ' USDT';
            document.getElementById('usdtVal').innerText = '$' + currentBalance.toFixed(2);
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function addBalance() {
            const amount = parseFloat(document.getElementById('addAmountInput').value);
            if (!isNaN(amount) && amount > 0) {
                currentBalance += amount;
                updateDisplay();
                closeModal('addModal');
                document.getElementById('addAmountInput').value = '';
            }
        }

        function executeSend() {
            const amount = parseFloat(document.getElementById('sendAmount').value);
            if (!isNaN(amount) && amount > 0 && amount <= currentBalance) {
                currentBalance -= amount;
                updateDisplay();
                alert('Transfer Successful!');
                closeModal('sendModal');
                document.getElementById('sendAmount').value = '';
            } else {
                alert('Invalid Amount or Insufficient Balance!');
            }
        }
    </script>
</body>
</html>
