<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Wallet Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Space for bottom nav */
        }

        .app-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
        }

        .balance-section {
            text-align: center;
            padding: 20px 0 30px 0;
        }

        .balance-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .btn-action {
            background: #1e293b;
            border: none;
            border-radius: 16px;
            padding: 14px 0;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-action:active {
            opacity: 0.8;
        }

        .asset-container {
            padding: 0 20px;
        }

        .asset-title {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .asset-card {
            background: #161e2e;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #121824;
            border-top: 1px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #38bdf8;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-box {
            background: #1e293b;
            width: 100%;
            max-width: 340px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            margin: 10px 0;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-cancel {
            background: transparent;
            color: #94a3b8;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span class="badge">Main Wallet</span>
        <span style="cursor:pointer;" onclick="openModal('addModal')">⚙️</span>
    </div>

    <div class="balance-section">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="totalVal">$100.00</div>
    </div>

    <div class="action-grid">
        <button class="btn-action" onclick="openModal('sendModal')">
            <span>↑</span> Send
        </button>
        <button class="btn-action" onclick="openModal('addModal')">
            <span>+</span> Deposit
        </button>
        <button class="btn-action">
            <span>⇄</span> Swap
        </button>
        <button class="btn-action">
            <span>⋮</span> More
        </button>
    </div>

    <div class="asset-container">
        <div class="asset-title">Assets</div>

        <div class="asset-card">
            <div class="asset-info">
                <div class="icon-circle" style="background:#0284c7;">T</div>
                <div>
                    <div style="font-weight: 600;">TON</div>
                    <div style="font-size: 12px; color: #64748b;">$2.45</div>
                </div>
            </div>
            <div style="text-align:right;">
                <div style="font-weight: 600;">0.00</div>
                <div style="font-size: 12px; color: #64748b;">$0.00</div>
            </div>
        </div>

        <div class="asset-card">
            <div class="asset-info">
                <div class="icon-circle" style="background:#10b981;">₮</div>
                <div>
                    <div style="font-weight: 600;">USDT</div>
                    <div style="font-size: 12px; color: #64748b;">$1.00</div>
                </div>
            </div>
            <div style="text-align:right;">
                <div style="font-weight: 600;" id="usdtVal">100.00</div>
                <div style="font-size: 12px; color: #64748b;" id="usdtSub">$100.00</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span style="font-size: 18px;">👛</span>
            <span>Wallet</span>
        </div>
        <div class="nav-item">
            <span style="font-size: 18px;">📈</span>
            <span>Trade</span>
        </div>
        <div class="nav-item">
            <span style="font-size: 18px;">🧭</span>
            <span>Browser</span>
        </div>
        <div class="nav-item">
            <span style="font-size: 18px;">⭐</span>
            <span>Collectibles</span>
        </div>
    </div>

    <!-- Send Modal -->
    <div class="modal" id="sendModal">
        <div class="modal-box">
            <h3 style="margin-bottom:12px;">Send Assets</h3>
            <input type="text" class="input-field" placeholder="Recipient Address">
            <input type="number" class="input-field" id="sendAmt" placeholder="Amount ($)">
            <button class="btn-submit" onclick="handleSend()">Confirm Transfer</button>
            <button class="btn-cancel" onclick="closeModal('sendModal')">Cancel</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="addModal">
        <div class="modal-box">
            <h3 style="margin-bottom:12px;">Add Balance</h3>
            <input type="number" class="input-field" id="addAmt" placeholder="Enter Amount ($)">
            <button class="btn-submit" onclick="handleAdd()">Add</button>
            <button class="btn-cancel" onclick="closeModal('addModal')">Cancel</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-box">
            <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
            <h3 style="margin-bottom:8px;">Transaction Submitted</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Your transaction is processing and will reflect shortly.</p>
            <button class="btn-submit" onclick="closeModal('successModal')">Done</button>
        </div>
    </div>

    <script>
        // Load stored balance or default to 100.00
        let balance = localStorage.getItem('walletBalance') ? parseFloat(localStorage.getItem('walletBalance')) : 100.00;

        function updateUI() {
            document.getElementById('totalVal').innerText = '$' + balance.toFixed(2);
            document.getElementById('usdtVal').innerText = balance.toFixed(2);
            document.getElementById('usdtSub').innerText = '$' + balance.toFixed(2);
            localStorage.setItem('walletBalance', balance);
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function handleAdd() {
            let val = parseFloat(document.getElementById('addAmt').value);
            if(!isNaN(val) && val > 0) {
                balance += val;
                updateUI();
                closeModal('addModal');
                document.getElementById('addAmt').value = '';
            }
        }

        function handleSend() {
            let val = parseFloat(document.getElementById('sendAmt').value);
            if(!isNaN(val) && val > 0 && val <= balance) {
                balance -= val;
                updateUI();
                closeModal('sendModal');
                document.getElementById('sendAmt').value = '';
                openModal('successModal');
            }
        }

        // Initialize UI
        updateUI();
    </script>
</body>
</html>
