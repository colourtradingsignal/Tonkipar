<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Asset Wallet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 390px;
            background: #121824;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .profile-badge {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 28px;
        }

        .balance-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .btn-action {
            background: #1e293b;
            border: none;
            border-radius: 16px;
            padding: 14px 0;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #283548;
        }

        .asset-title {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .asset-card {
            background: #1a2232;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .asset-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .asset-name {
            font-size: 15px;
            font-weight: 600;
        }

        .asset-sub {
            font-size: 12px;
            color: #64748b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: #1e293b;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 20px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            margin: 10px 0;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 10px;
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="profile-badge">Main Wallet</span>
        <span style="cursor:pointer;" onclick="openModal('addModal')">⚙️</span>
    </div>

    <div class="balance-container">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="totalVal">$100.00</div>
    </div>

    <div class="action-row">
        <button class="btn-action" onclick="openModal('sendModal')">
            <span>↑</span> Send
        </button>
        <button class="btn-action" onclick="openModal('addModal')">
            <span>+</span> Deposit
        </button>
        <button class="btn-action">
            <span>⇄</span> Swap
        </button>
        <button class="btn-action">
            <span>⋮</span> More
        </button>
    </div>

    <div class="asset-title">Assets</div>

    <div class="asset-card">
        <div class="asset-info">
            <div class="icon-circle" style="background:#0284c7;">T</div>
            <div>
                <div class="asset-name">TON</div>
                <div class="asset-sub">$2.45</div>
            </div>
        </div>
        <div style="text-align:right;">
            <div class="asset-name">0.00</div>
            <div class="asset-sub">$0.00</div>
        </div>
    </div>

    <div class="asset-card">
        <div class="asset-info">
            <div class="icon-circle" style="background:#10b981;">₮</div>
            <div>
                <div class="asset-name">USDT</div>
                <div class="asset-sub">$1.00</div>
            </div>
        </div>
        <div style="text-align:right;">
            <div class="asset-name" id="usdtVal">100.00</div>
            <div class="asset-sub" id="usdtSub">$100.00</div>
        </div>
    </div>
</div>

<!-- Send Modal -->
<div class="modal" id="sendModal">
    <div class="modal-box">
        <h3 style="margin-bottom:10px;">Send Funds</h3>
        <input type="text" class="input-field" placeholder="Wallet Address">
        <input type="number" class="input-field" id="sendAmt" placeholder="Amount ($)">
        <button class="btn-submit" onclick="handleSend()">Confirm</button>
        <button class="btn-submit" style="background:transparent; color:#94a3b8; margin-top:5px;" onclick="closeModal('sendModal')">Cancel</button>
    </div>
</div>

<!-- Deposit Modal -->
<div class="modal" id="addModal">
    <div class="modal-box">
        <h3 style="margin-bottom:10px;">Add Balance</h3>
        <input type="number" class="input-field" id="addAmt" placeholder="Enter Amount ($)">
        <button class="btn-submit" onclick="handleAdd()">Add</button>
        <button class="btn-submit" style="background:transparent; color:#94a3b8; margin-top:5px;" onclick="closeModal('addModal')">Cancel</button>
    </div>
</div>

<script>
    let balance = 100.00;

    function updateUI() {
        document.getElementById('totalVal').innerText = '$' + balance.toFixed(2);
        document.getElementById('usdtVal').innerText = balance.toFixed(2);
        document.getElementById('usdtSub').innerText = '$' + balance.toFixed(2);
    }

    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function handleAdd() {
        let val = parseFloat(document.getElementById('addAmt').value);
        if(!isNaN(val) && val > 0) {
            balance += val;
            updateUI();
            closeModal('addModal');
            document.getElementById('addAmt').value = '';
        }
    }

    function handleSend() {
        let val = parseFloat(document.getElementById('sendAmt').value);
        if(!isNaN(val) && val > 0 && val <= balance) {
            balance -= val;
            updateUI();
            alert("Action Completed");
            closeModal('sendModal');
            document.getElementById('sendAmt').value = '';
        }
    }
</script>

</body>
</html>
